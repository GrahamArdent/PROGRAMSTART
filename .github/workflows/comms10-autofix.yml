name: COMMS-10 Branch Autofix

on:
  push:
    branches:
      - methodology/test-authority-boundaries-20260906

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_CACHE_DIR: .cache/uv
  PRE_COMMIT_HOME: .cache/pre-commit

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: methodology/test-authority-boundaries-20260906

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Sync development environment
        run: uv sync --extra dev

      - name: Apply and verify repository hooks
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t changed_files < <(git diff --name-only origin/main...HEAD)
          if (( ${#changed_files[@]} == 0 )); then
            exit 0
          fi
          SKIP=programstart-validate,programstart-drift,sync-requirements-txt \
            uv run pre-commit run --files "${changed_files[@]}" || true
          SKIP=programstart-validate,programstart-drift,sync-requirements-txt \
            uv run pre-commit run --files "${changed_files[@]}"

      - name: Commit hook-produced fixes only
        shell: bash
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "No hook-produced fixes remain."
            exit 0
          fi
          git config user.name 'programstart-comms10-autofix'
          git config user.email 'programstart-comms10-autofix@localhost'
          git commit -m 'style: apply repository hook fixes for COMMS-10'
          git push origin HEAD:methodology/test-authority-boundaries-20260906
