name: Intent Compiler Format Apply

on:
  push:
    branches:
      - programstart/intent-compile-work-packet-v0

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: programstart/intent-compile-work-packet-v0
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev
      - name: Apply exact Ruff normalization
        run: |
          uv run ruff check --fix scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run ruff format scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
      - name: Commit deterministic formatter delta only
        run: |
          if git diff --quiet -- scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py; then
            echo "No formatter delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          git commit -m "style: apply intent compiler repository formatting"
          git push origin HEAD:programstart/intent-compile-work-packet-v0
