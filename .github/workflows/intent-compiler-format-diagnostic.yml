name: Intent Compiler Format Diagnostic

on:
  push:
    branches:
      - programstart/intent-compile-work-packet-v0

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev
      - name: Show exact Ruff delta
        run: |
          uv run ruff check --fix scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py || true
          uv run ruff format scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          git diff -- scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
