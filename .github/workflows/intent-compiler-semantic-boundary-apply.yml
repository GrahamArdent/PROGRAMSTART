name: Intent Compiler Semantic Boundary Apply

on:
  push:
    branches:
      - programstart/intent-compile-work-packet-v0

permissions:
  contents: write

jobs:
  semantic-boundary-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: programstart/intent-compile-work-packet-v0
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev
      - name: Remove lexical intent classification from compiler authority path
        run: |
          python - <<'PY'
          from pathlib import Path

          code_path = Path("scripts/programstart_intent_compile.py")
          code = code_path.read_text()
          start = code.index("\ndef infer_intent_kind(raw_intent: str) -> IntentKind:\n")
          end = code.index("\ndef _explicit_constraints(raw_intent: str) -> list[str]:\n", start)
          code = code[:start] + "\n" + code[end:]
          code = code.replace(
              "    selected_kind = kind or infer_intent_kind(normalized)\n",
              "    selected_kind = kind or IntentKind.UNKNOWN\n",
          )
          code = code.replace(
              '        unresolved.append("Intent family is not safely classifiable; mutation authority is withheld pending interpretation.")\n',
              '        unresolved.append("No trusted semantic intent family was supplied; mutation authority is withheld pending interpretation.")\n',
          )
          code_path.write_text(code)

          test_path = Path("tests/test_programstart_intent_compile.py")
          test = test_path.read_text()
          test = test.replace(
              '    packet = compile_work_packet(case["intent"], authority)\n',
              '    packet = compile_work_packet(case["intent"], authority, kind=IntentKind(case["expected"]["kind"]))\n',
          )
          test = test.replace(
              '    left = compile_work_packet(case["intent"], authority)\n    right = compile_work_packet(case["intent"], authority)\n',
              '    kind = IntentKind(case["expected"]["kind"])\n    left = compile_work_packet(case["intent"], authority, kind=kind)\n    right = compile_work_packet(case["intent"], authority, kind=kind)\n',
          )
          test = test.replace(
              '        authority,\n    )\n\n    assert packet.intent.kind == IntentKind.AUDIT',
              '        authority,\n        kind=IntentKind.AUDIT,\n    )\n\n    assert packet.intent.kind == IntentKind.AUDIT',
          )
          test = test.replace(
              '    packet = compile_work_packet("Continue Resume Creator.", authority)\n    gap =',
              '    packet = compile_work_packet("Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION)\n    gap =',
          )
          test = test.replace(
              '        authority,\n    )\n\n    assert "GrahamArdent/repo-watchtower" not in packet.scope.mutable_identifiers',
              '        authority,\n        kind=IntentKind.AUDIT,\n    )\n\n    assert "GrahamArdent/repo-watchtower" not in packet.scope.mutable_identifiers',
          )
          test = test.replace(
              '    packet = compile_work_packet("Continue Resume Creator.", authority)\n    assert verify_integrity(packet)',
              '    packet = compile_work_packet("Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION)\n    assert verify_integrity(packet)',
          )
          test = test.replace(
              '    packet = compile_work_packet("Continue Resume Creator.", authority)\n\n    same = assess_authority_drift',
              '    packet = compile_work_packet("Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION)\n\n    same = assess_authority_drift',
          )
          test = test.replace(
              '        authority,\n    )\n    prompt = render_chatgpt_prompt(packet)',
              '        authority,\n        kind=IntentKind.CONTINUATION,\n    )\n    prompt = render_chatgpt_prompt(packet)',
              1,
          )
          test = test.replace(
              '    left = compile_work_packet("Continue Resume Creator.", authority)\n',
              '    left = compile_work_packet("Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION)\n',
          )
          test = test.replace(
              '    resume = compile_work_packet("Continue Resume Creator.", resume_authority)\n',
              '    resume = compile_work_packet("Continue Resume Creator.", resume_authority, kind=IntentKind.CONTINUATION)\n',
          )
          test = test.replace(
              '            str(authority_path),\n        ]\n',
              '            str(authority_path),\n            "--kind",\n            "continuation",\n        ]\n',
              1,
          )
          insertion = '''\n\ndef test_natural_language_without_trusted_semantic_kind_fails_narrow() -> None:\n    authority = _authority("resume_creator_parallel_safe_continuation")\n    packet = compile_work_packet("Continue Resume Creator.", authority)\n\n    assert packet.intent.kind == IntentKind.UNKNOWN\n    assert packet.admission_hint == "needs_interpretation"\n    assert packet.dependencies.expected_write_set == []\n    assert packet.scope.allowed_effects == []\n    assert "trusted semantic intent family" in packet.intent.unresolved_ambiguities[0]\n'''
          marker = "\ndef test_authority_snapshot_rejects_internal_mutable_read_only_contradiction() -> None:\n"
          if insertion.strip() not in test:
              test = test.replace(marker, insertion + marker)
          test_path.write_text(test)
          PY
      - name: Normalize and verify changed Python
        run: |
          uv run ruff check --fix scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run ruff format scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run ruff check scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run pytest -q tests/test_programstart_intent_compile.py
      - name: Commit bounded semantic remediation
        run: |
          if git diff --quiet -- scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py; then
            echo "No semantic remediation delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          git commit -m "fix: separate intent interpretation from deterministic compilation"
          git push origin HEAD:programstart/intent-compile-work-packet-v0
