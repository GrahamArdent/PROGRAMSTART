name: Intent Compiler Semantic Boundary Apply

on:
  push:
    branches:
      - programstart/intent-compile-work-packet-v0

permissions:
  contents: write

jobs:
  semantic-boundary-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: programstart/intent-compile-work-packet-v0
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev
      - name: Apply semantic interpretation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          code_path = Path("scripts/programstart_intent_compile.py")
          code = code_path.read_text()
          marker = "\ndef infer_intent_kind(raw_intent: str) -> IntentKind:\n"
          if marker in code:
              start = code.index(marker)
              end = code.index("\ndef _explicit_constraints(raw_intent: str) -> list[str]:\n", start)
              code = code[:start] + "\n" + code[end:]
          code = code.replace(
              "    selected_kind = kind or infer_intent_kind(normalized)\n",
              "    selected_kind = kind or IntentKind.UNKNOWN\n",
          )
          old = (
              '        unresolved.append("Intent family is not safely classifiable; '
              'mutation authority is withheld pending interpretation.")\n'
          )
          new = (
              '        unresolved.append(\n'
              '            "No trusted semantic intent family was supplied; "\n'
              '            "mutation authority is withheld pending interpretation."\n'
              '        )\n'
          )
          code = code.replace(old, new)
          code_path.write_text(code)

          test_path = Path("tests/test_programstart_intent_compile.py")
          test = test_path.read_text()
          replacements = [
              (
                  '    packet = compile_work_packet(case["intent"], authority)\n',
                  '    packet = compile_work_packet(\n'
                  '        case["intent"], authority, kind=IntentKind(case["expected"]["kind"])\n'
                  '    )\n',
              ),
              (
                  '    left = compile_work_packet(case["intent"], authority)\n'
                  '    right = compile_work_packet(case["intent"], authority)\n',
                  '    kind = IntentKind(case["expected"]["kind"])\n'
                  '    left = compile_work_packet(case["intent"], authority, kind=kind)\n'
                  '    right = compile_work_packet(case["intent"], authority, kind=kind)\n',
              ),
              (
                  '        authority,\n    )\n\n    assert packet.intent.kind == IntentKind.AUDIT',
                  '        authority,\n        kind=IntentKind.AUDIT,\n'
                  '    )\n\n    assert packet.intent.kind == IntentKind.AUDIT',
              ),
              (
                  '    packet = compile_work_packet("Continue Resume Creator.", authority)\n    gap =',
                  '    packet = compile_work_packet(\n'
                  '        "Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION\n'
                  '    )\n    gap =',
              ),
              (
                  '        authority,\n    )\n\n    assert "GrahamArdent/repo-watchtower" not in packet.scope.mutable_identifiers',
                  '        authority,\n        kind=IntentKind.AUDIT,\n'
                  '    )\n\n    assert "GrahamArdent/repo-watchtower" not in packet.scope.mutable_identifiers',
              ),
              (
                  '    packet = compile_work_packet("Continue Resume Creator.", authority)\n'
                  '    assert verify_integrity(packet)',
                  '    packet = compile_work_packet(\n'
                  '        "Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION\n'
                  '    )\n    assert verify_integrity(packet)',
              ),
              (
                  '    packet = compile_work_packet("Continue Resume Creator.", authority)\n\n'
                  '    same = assess_authority_drift',
                  '    packet = compile_work_packet(\n'
                  '        "Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION\n'
                  '    )\n\n    same = assess_authority_drift',
              ),
              (
                  '    left = compile_work_packet("Continue Resume Creator.", authority)\n',
                  '    left = compile_work_packet(\n'
                  '        "Continue Resume Creator.", authority, kind=IntentKind.CONTINUATION\n'
                  '    )\n',
              ),
              (
                  '    resume = compile_work_packet("Continue Resume Creator.", resume_authority)\n',
                  '    resume = compile_work_packet(\n'
                  '        "Continue Resume Creator.", resume_authority, kind=IntentKind.CONTINUATION\n'
                  '    )\n',
              ),
          ]
          for old_text, new_text in replacements:
              test = test.replace(old_text, new_text)

          renderer_old = (
              '        authority,\n    )\n'
              '    prompt = render_chatgpt_prompt(packet)'
          )
          renderer_new = (
              '        authority,\n        kind=IntentKind.CONTINUATION,\n'
              '    )\n    prompt = render_chatgpt_prompt(packet)'
          )
          test = test.replace(renderer_old, renderer_new, 1)

          cli_old = '            str(authority_path),\n        ]\n'
          cli_new = (
              '            str(authority_path),\n'
              '            "--kind",\n'
              '            "continuation",\n'
              '        ]\n'
          )
          test = test.replace(cli_old, cli_new, 1)

          insertion = '''\n\ndef test_natural_language_without_trusted_semantic_kind_fails_narrow() -> None:\n    authority = _authority("resume_creator_parallel_safe_continuation")\n    packet = compile_work_packet("Continue Resume Creator.", authority)\n\n    assert packet.intent.kind == IntentKind.UNKNOWN\n    assert packet.admission_hint == "needs_interpretation"\n    assert packet.dependencies.expected_write_set == []\n    assert packet.scope.allowed_effects == []\n    assert "trusted semantic intent family" in packet.intent.unresolved_ambiguities[0]\n'''
          insertion_marker = "\ndef test_authority_snapshot_rejects_internal_mutable_read_only_contradiction() -> None:\n"
          if "test_natural_language_without_trusted_semantic_kind_fails_narrow" not in test:
              test = test.replace(insertion_marker, insertion + insertion_marker)
          test_path.write_text(test)
          PY
      - name: Normalize and verify changed Python
        run: |
          uv run ruff check --fix scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run ruff format scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run ruff check scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          uv run pytest -q tests/test_programstart_intent_compile.py
      - name: Commit bounded semantic remediation
        run: |
          if git diff --quiet -- scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py; then
            echo "No semantic remediation delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/programstart_intent_compile.py tests/test_programstart_intent_compile.py
          git commit -m "fix: separate intent interpretation from deterministic compilation"
          git push origin HEAD:programstart/intent-compile-work-packet-v0
