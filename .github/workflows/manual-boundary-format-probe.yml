name: Manual Boundary Format Probe

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_manual_boundary_origin_contract.py
      - .github/workflows/manual-boundary-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev
      - name: Print exact Ruff formatter diff
        shell: bash
        run: |
          uv run ruff format tests/test_manual_boundary_origin_contract.py
          git diff -- tests/test_manual_boundary_origin_contract.py
