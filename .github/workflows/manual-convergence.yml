name: Manual Convergence Gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the full convergence gate is being run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-convergence-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_CACHE_DIR: .cache/uv
  PRE_COMMIT_HOME: .cache/pre-commit

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Cache uv packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-manual-convergence-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-manual-convergence-${{ runner.os }}-

      - name: Cache pre-commit hooks
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-manual-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-manual-${{ runner.os }}-

      - name: Sync development environment
        run: uv sync --extra dev

      - name: Install Playwright browser
        run: uv run python -m playwright install --with-deps chromium

      - name: Run full repository convergence gate
        env:
          PROGRAMSTART_NOX_BOOTSTRAP_DIR: ${{ runner.temp }}/programstart-nox-bootstrap
          PROGRAMSTART_NOX_FACTORY_DIR: ${{ runner.temp }}/programstart-nox-factory-smoke
        run: uv run nox -s ci

      - name: Upload golden failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: manual-convergence-golden-failures
          path: |
            outputs/golden-failures/**
            ${{ runner.temp }}/programstart-nox-bootstrap/outputs/golden-failures/**
          if-no-files-found: ignore

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: manual-convergence-dist
          path: dist/*
          if-no-files-found: ignore
