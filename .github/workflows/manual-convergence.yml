name: Manual Convergence Gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the full convergence gate is being run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-convergence-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set absolute convergence cache paths
        shell: bash
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/programstart-convergence-uv" >> "$GITHUB_ENV"
          echo "PRE_COMMIT_HOME=$RUNNER_TEMP/programstart-convergence-pre-commit" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-manual-convergence-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-manual-convergence-${{ runner.os }}-

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-manual-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-manual-${{ runner.os }}-

      - name: Sync development environment
        run: uv sync --extra dev

      - name: Install Playwright browser
        run: uv run python -m playwright install --with-deps chromium

      - name: Run full repository convergence gate
        env:
          PROGRAMSTART_NOX_BOOTSTRAP_DIR: ${{ runner.temp }}/programstart-nox-bootstrap
          PROGRAMSTART_NOX_FACTORY_DIR: ${{ runner.temp }}/programstart-nox-factory-smoke
        run: uv run nox -s ci

      - name: Upload golden failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: manual-convergence-golden-failures
          path: |
            outputs/golden-failures/**
            ${{ runner.temp }}/programstart-nox-bootstrap/outputs/golden-failures/**
          if-no-files-found: ignore

      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: manual-convergence-dist
          path: dist/*
          if-no-files-found: ignore
