name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_CACHE_DIR: .cache/uv
  PRE_COMMIT_HOME: .cache/pre-commit

jobs:
  required-pr-gate:
    name: Required PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.12'

      - name: Check objective claims with accepted base policy
        env:
          GH_TOKEN: ${{ github.token }}
          OBJECTIVE_REPOSITORY: ${{ github.repository }}
          OBJECTIVE_BASE: ${{ github.event.pull_request.base.sha }}
          OBJECTIVE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          policy_dir="${{ runner.temp }}/objective-policy"
          mkdir -p "$policy_dir"
          git cat-file -e "$OBJECTIVE_BASE^{commit}"
          git cat-file -e "$OBJECTIVE_HEAD^{commit}"
          if ! git cat-file -e "$OBJECTIVE_BASE:scripts/programstart_objective_proof.py"; then
            # First policy introduction cannot self-install as trusted authority.
            if git cat-file -e "$OBJECTIVE_BASE:PROGRAMBUILD/OBJECTIVES.json" 2>/dev/null || \
               git cat-file -e "$OBJECTIVE_HEAD:PROGRAMBUILD/OBJECTIVES.json" 2>/dev/null || \
               git cat-file -e "$OBJECTIVE_BASE:PROGRAMBUILD/RESEARCH_EVIDENCE.json" 2>/dev/null || \
               git cat-file -e "$OBJECTIVE_HEAD:PROGRAMBUILD/RESEARCH_EVIDENCE.json" 2>/dev/null; then
              echo "BLOCKED: enroll only after the accepted base provides objective policy."
              exit 1
            fi
            echo "UNENROLLED: no objective completion is certified by this bootstrap PR."
            exit 0
          fi
          if git cat-file -e "$OBJECTIVE_BASE:scripts/programstart_research_admission.py" 2>/dev/null; then
            git show "$OBJECTIVE_BASE:scripts/programstart_research_admission.py" > "$policy_dir/programstart_research_admission.py"
          elif git cat-file -e "$OBJECTIVE_BASE:PROGRAMBUILD/RESEARCH_EVIDENCE.json" 2>/dev/null || \
               git cat-file -e "$OBJECTIVE_HEAD:PROGRAMBUILD/RESEARCH_EVIDENCE.json" 2>/dev/null; then
            echo "BLOCKED: research enrollment requires accepted policy first."
            exit 1
          fi
          git show "$OBJECTIVE_BASE:scripts/programstart_objective_proof.py" > "$policy_dir/programstart_objective_proof.py"
          git show "$OBJECTIVE_BASE:scripts/programstart_challenge_merge.py" > "$policy_dir/programstart_challenge_merge.py"
          export OBJECTIVE_POLICY_DIR="$policy_dir"
          python -I - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, os.environ['OBJECTIVE_POLICY_DIR'])
          from programstart_challenge_merge import GitHub
          from programstart_objective_proof import merge_objective_snapshot
          result = merge_objective_snapshot(
              GitHub(), os.environ['OBJECTIVE_REPOSITORY'],
              os.environ['OBJECTIVE_BASE'], os.environ['OBJECTIVE_HEAD'],
          )
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Install uv
        run: python -m pip install uv

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-pr-validation-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-pr-validation-${{ runner.os }}-

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-pr-validation-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-pr-validation-${{ runner.os }}-

      - name: Sync development environment
        run: uv sync --extra dev

      - name: Check lockfile integrity
        run: uv lock --check

      - name: Collect pull request changes
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          cat changed_files.txt

      - name: Run changed-file repository hooks
        shell: bash
        run: |
          mapfile -t changed_files < changed_files.txt
          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed files to validate."
            exit 0
          fi
          SKIP=programstart-validate,programstart-drift,sync-requirements-txt \
            uv run pre-commit run --files "${changed_files[@]}"

      - name: Check exported requirements stay synchronized
        shell: bash
        run: |
          generated="${{ runner.temp }}/requirements.txt"
          uv export --format requirements-txt --extra dev --no-hashes -o "$generated"
          tail -n +3 requirements.txt > "${{ runner.temp }}/requirements.expected"
          tail -n +3 "$generated" > "${{ runner.temp }}/requirements.actual"
          diff -u "${{ runner.temp }}/requirements.expected" "${{ runner.temp }}/requirements.actual"

      - name: Establish base test failure set
        shell: bash
        run: |
          base_dir="${{ runner.temp }}/programstart-base"
          git worktree add --detach "$base_dir" "origin/${{ github.base_ref }}"
          # The historical base lacks tests/__init__.py. In an isolated worktree,
          # a third-party 'tests' package can shadow local test-helper imports,
          # causing pytest collection to exit 2 before baseline comparison.
          # Add only the namespace marker in this disposable baseline worktree.
          # Do not skip tests, change assertions, or classify collection errors
          # as inherited test failures.
          if [[ ! -e "$base_dir/tests/__init__.py" ]]; then
            printf '"""Local test helper imports for baseline validation."""\n' > "$base_dir/tests/__init__.py"
          fi
          (
            cd "$base_dir"
            uv sync --extra dev
            # Historical tests import both tests.* and bare fixture helpers.
            # Make both canonical repository paths visible for collection.
            export PYTHONPATH="$PWD/tests:$PWD"
            set +e
            uv run pytest -q --junitxml="${{ runner.temp }}/base-tests.xml"
            status=$?
            set -e
            if (( status > 1 )); then
              echo "Base test run could not complete cleanly (pytest exit $status)."
              exit "$status"
            fi
            echo "$status" > "${{ runner.temp }}/base-pytest-status"
          )

      - name: Run head tests and reject new failures
        shell: bash
        run: |
          # Use the same helper import search order as the baseline worktree.
          export PYTHONPATH="$PWD/tests:$PWD"
          set +e
          uv run coverage run -m pytest -q --junitxml="${{ runner.temp }}/head-tests.xml"
          head_status=$?
          set -e
          if (( head_status > 1 )); then
            echo "Head test run could not complete cleanly (pytest exit $head_status)."
            exit "$head_status"
          fi

          uv run coverage report -m
          uv run coverage json -o coverage.json
          uv run coverage report -m > coverage.txt
          git rev-parse HEAD > coverage-checkout-sha.txt
          echo '${{ github.event.pull_request.head.sha }}' > coverage-head-sha.txt

          python - <<'PY'
          import json
          import os
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          report = json.loads(Path("coverage.json").read_text())
          sources = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["coverage"]["run"]["source"]
          expected = {module.replace(".", "/") + ".py" for module in sources}
          missing = sorted(expected - set(report["files"]))
          if missing:
              raise SystemExit(f"Configured coverage modules missing from report: {missing}")
          incomplete = sorted(
              path for path in expected
              if report["files"][path]["summary"]["missing_lines"]
              or report["files"][path]["summary"]["missing_branches"]
          )
          if incomplete:
              raise SystemExit(f"Production statements or branch exits remain uncovered: {incomplete}")

          def failed_tests(path: Path) -> set[str]:
              tree = ET.parse(path)
              failed: set[str] = set()
              for case in tree.getroot().iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  classname = case.attrib.get("classname", "")
                  name = case.attrib.get("name", "")
                  failed.add(f"{classname}::{name}")
              return failed

          base = failed_tests(root / "base-tests.xml")
          head = failed_tests(root / "head-tests.xml")
          introduced = sorted(head - base)
          resolved = sorted(base - head)

          print(f"Base failing tests: {len(base)}")
          print(f"Head failing tests: {len(head)}")
          if resolved:
              print(f"Resolved inherited failures: {len(resolved)}")
              for test in resolved:
                  print(f"  FIXED {test}")
          if introduced:
              print(f"New failing tests introduced by this PR: {len(introduced)}")
              for test in introduced:
                  print(f"  NEW {test}")
              raise SystemExit(1)

          print("PASS: this PR introduces no new test failures relative to its base.")
          PY

      - name: Retain head coverage reports
        if: always() && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-${{ github.event.pull_request.head.sha }}
          path: |
            coverage.json
            coverage.txt
            coverage-checkout-sha.txt
            coverage-head-sha.txt
          if-no-files-found: error

      - name: Restore tracked files after tests
        run: git reset --hard HEAD

      - name: Validate changed-surface drift
        run: uv run programstart drift --changed-file-list changed_files.txt

      - name: Build documentation strictly
        run: uv run mkdocs build --strict
