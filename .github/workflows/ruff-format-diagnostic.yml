name: Ruff Format Diagnostic

on:
  push:
    branches:
      - methodology/shift-left-quality-gate

permissions:
  contents: read

jobs:
  show-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install Ruff 0.15.8
        run: python -m pip install ruff==0.15.8
      - name: Show formatter diff
        run: |
          ruff format --diff tests/test_pre_push_quality_gate.py || true
